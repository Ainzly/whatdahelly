<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Find Out!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #222;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 700px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 18px;
            margin: 10px 0;

            border: 1px solid #555;
            border-radius: 10px;

            background: #333;
            color: white;

            font-size: 18px;
            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #444;
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.97);
        }

        /* Fake powered-off screen */
        #powerOff {
            display: none;

            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            background: #000;

            z-index: 999999;
        }
    </style>
</head>

<body>

<header>
    <h1>My Website</h1>
</header>

<main>

    <h2>Welcome</h2>
    <p>Choose an option:</p>

    <button onclick="powerOff()">Home</button>
    <button onclick="powerOff()">About</button>
    <button onclick="powerOff()">Services</button>
    <button onclick="powerOff()">Contact</button>
    <button onclick="powerOff()">Settings</button>

</main>

<div id="powerOff"></div>

<script>
    function powerOff() {
        document.getElementById("powerOff").style.display = "block";
    }
    // Disable right-click
    document.addEventListener("contextmenu", function(event) {
        event.preventDefault();
    });

    // Disable long-press on mobile
    document.addEventListener("touchstart", function(event) {
        if (event.touches.length > 1) {
            event.preventDefault();
        }
    }, { passive: false });

    document.addEventListener("touchmove", function(event) {
        event.preventDefault();
    }, { passive: false });

    // Disable text selection
    document.addEventListener("selectstart", function(event) {
        event.preventDefault();
    });

    // Disable dragging
    document.addEventListener("dragstart", function(event) {
        event.preventDefault();
    });


</script>

</body>
</html>
